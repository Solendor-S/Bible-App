name: Release

# Build + publish installers when a version tag is pushed (e.g. `git tag v2.3.0 && git push --tags`).
# electron-builder uploads to a DRAFT GitHub release named after the version; a human reviews the
# notes and clicks Publish. Can also be run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # electron-builder creates the release + uploads assets via GITHUB_TOKEN

jobs:
  build:
    strategy:
      fail-fast: false          # a Windows failure must not cancel the macOS build (or vice-versa)
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest     # unsigned .dmg — users right-click → Open past Gatekeeper
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true             # bible.db ships via Git LFS — needed in the package
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build      # electron-vite build → out/
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
