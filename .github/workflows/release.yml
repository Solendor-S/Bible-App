name: Release

# Build installers when a version tag is pushed (e.g. `git tag v2.3.0 && git push origin v2.3.0`),
# then publish them to a single DRAFT GitHub release for a human to review and publish.
# Build and publish are decoupled on purpose: running electron-builder --publish in parallel
# matrix jobs races and creates duplicate draft releases, so here the matrix only *builds* and
# uploads artifacts, and one final job collects them and creates the release exactly once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the release job needs to create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false          # a Windows failure must not cancel the macOS build (or vice-versa)
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest     # unsigned .dmg — users right-click → Open past Gatekeeper
            target: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true             # bible.db ships via Git LFS — needed in the package
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build                              # electron-vite build → out/
      - run: npx electron-builder ${{ matrix.target }} --publish never   # build only; publish happens once, in the release job
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            App/dist-installer/*-setup.exe
            App/dist-installer/*-setup.exe.blockmap
            App/dist-installer/*.dmg
            App/dist-installer/*.dmg.blockmap
            App/dist-installer/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4     # for package.json (version fallback) — no LFS needed
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true        # flatten both matrix artifacts into one dir
      - name: Publish assets to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in v*) ;; *) tag="v$(node -p "require('./App/package.json').version")";; esac
          echo "Release tag: $tag"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --generate-notes artifacts/*
          fi
